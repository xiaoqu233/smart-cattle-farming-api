server:
  port: 9000

spring:
  application:
    name: zhyz-gateway
  main:
    web-application-type: reactive
  profiles:
    active: dev
  cloud:
    nacos:
      username: nacos
      password: nacos # 账号密码改成自己的
      discovery:
        server-addr: localhost:8848 # ip地址改成自己的
        namespace: ${spring.profiles.active}
      config:
        server-addr: localhost:8848
        file-extension: yaml
        namespace : ${spring.profiles.active}